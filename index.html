<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from './vendor/three/RoomEnvironment.js';

/* размеры в мм по развёртке: 330×210×65, клапан 65, картон 2 мм */
const W=330, D=210, H=65, FLAP=65, T=2;
/* развёртка в пикселях: 1864×2484, 4 px = 1 мм */
const IW=1864, IH=2484;
const EDGE=0xF5C21A;

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.25;

const cam=new THREE.PerspectiveCamera(30,1,10,6000);
cam.position.set(370,920,920);

/* свет ровный: крышка и стенки одного тона, как в печати */
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(-380,900,520);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=6;sun.shadow.bias=-.0004;
Object.assign(sun.shadow.camera,{left:-500,right:500,top:500,bottom:-500,near:100,far:2200});
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff,0xf2eee2,.9));
scene.add(new THREE.AmbientLight(0xffffff,.55));

const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.ShadowMaterial({opacity:.16}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const manager=new THREE.LoadingManager();
let loadFailed=false;
manager.onLoad=()=>{
  if(!loadFailed)document.getElementById('load')?.remove();
  invalidate();
  if('requestIdleCallback' in window)requestIdleCallback(prefetchCards,{timeout:1200});
  else setTimeout(prefetchCards,0);
};
manager.onError=url=>{loadFailed=true;const label=document.getElementById('load');if(label)label.textContent='Не удалось загрузить изображение. Обновите страницу.';console.error('Не загружен ресурс:',url)};
const tl=new THREE.TextureLoader(manager);
const tex=u=>{const t=tl.load(u,invalidate);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
/* насыщенность печати: усиливаем цвет текстуры в шейдере */
const SAT=1.35;
const saturate=m=>{m.onBeforeCompile=s=>{s.fragmentShader=s.fragmentShader.replace('#include <map_fragment>',
  `#include <map_fragment>
  float l=dot(diffuseColor.rgb,vec3(.2126,.7152,.0722));
  diffuseColor.rgb=clamp(mix(vec3(l),diffuseColor.rgb,${SAT.toFixed(2)}),0.,1.);`)};return m};
/* снаружи 3275:12680 (без паттерна в карманах); внутри: 1 — 3259:26481 крупный паттерн, 2 — 3330:14677 мелкий паттерн 60% */
const OUT=tex('outer5.jpg?rev=84a0c5e88023'); /* текущая печать: штамп на магнитах, бумаги 8 и 4–5 */
const INN=tex('inner5.jpg?rev=1edb65029462'); /* текущая печать: бумага 10 + полоса 40 мм над ложементом */
const mOut=saturate(new THREE.MeshStandardMaterial({map:OUT,roughness:.85,metalness:0}));
const mIn=saturate(new THREE.MeshStandardMaterial({map:INN,roughness:.9,metalness:0}));
const mEdge=new THREE.MeshStandardMaterial({color:EDGE,roughness:.95});

/* четырёхугольник: углы в мм ↔ углы на развёртке в пикселях (a,b,c,d по кругу) */
function quad(mat,pts,px,off){
  const g=new THREE.BufferGeometry();
  const P=pts.map(p=>new THREE.Vector3(...p));
  const n=new THREE.Vector3().subVectors(P[1],P[0]).cross(new THREE.Vector3().subVectors(P[3],P[0])).normalize();
  const o=n.clone().multiplyScalar(off);
  g.setAttribute('position',new THREE.Float32BufferAttribute(P.flatMap(p=>[p.x+o.x,p.y+o.y,p.z+o.z]),3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(px.flatMap(([x,y])=>[x/IW,1-y/IH]),2));
  g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m;
}
/* картонная панель: торец-коробка + наружная и внутренняя печать */
function panel(group,pts,outPx,inPx){
  // pts — наружная плоскость; толщина уходит внутрь коробки
  const P=pts.map(p=>new THREE.Vector3(...p));
  const n=new THREE.Vector3().subVectors(P[1],P[0]).cross(new THREE.Vector3().subVectors(P[3],P[0])).normalize();
  group.add(quad(mOut,pts,outPx,.05));
  const inner=pts.map(p=>[p[0]-n.x*T,p[1]-n.y*T,p[2]-n.z*T]).reverse();
  group.add(quad(mIn,inner,inPx.slice().reverse(),.05));
  // торец
  const c=P.reduce((a,b)=>a.add(b),new THREE.Vector3()).multiplyScalar(.25).addScaledVector(n,-T/2);
  const u=new THREE.Vector3().subVectors(P[1],P[0]), v=new THREE.Vector3().subVectors(P[3],P[0]);
  const geo=new THREE.BoxGeometry(u.length(),v.length(),T-.2);
  const m=new THREE.Mesh(geo,mEdge);
  const basis=new THREE.Matrix4().makeBasis(u.clone().normalize(),v.clone().normalize(),n);
  m.quaternion.setFromRotationMatrix(basis);m.position.copy(c);m.castShadow=true;m.receiveShadow=true;group.add(m);
}

const x0=-W/2,x1=W/2,z0=-D/2,z1=D/2;
const box=new THREE.Group();scene.add(box);

/* дно: снаружи низ (y=0), внутри — верх */
panel(box,[[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]],
  [[272,1112],[1592,1112],[1592,272],[272,272]],
  [[272,1372],[1592,1372],[1592,2212],[272,2212]]);
/* передняя стенка */
panel(box,[[x0,0,z1],[x1,0,z1],[x1,H,z1],[x0,H,z1]],
  [[272,272],[1592,272],[1592,12],[272,12]],
  [[272,2212],[1592,2212],[1592,2472],[272,2472]]);
/* задняя стенка */
panel(box,[[x1,0,z0],[x0,0,z0],[x0,H,z0],[x1,H,z0]],
  [[1592,1112],[272,1112],[272,1372],[1592,1372]],
  [[1592,1372],[272,1372],[272,1112],[1592,1112]]);
/* левая боковина */
panel(box,[[x0,0,z0],[x0,0,z1],[x0,H,z1],[x0,H,z0]],
  [[272,1112],[272,272],[12,272],[12,1112]],
  [[272,1372],[272,2212],[12,2212],[12,1372]]);
/* правая боковина */
panel(box,[[x1,0,z1],[x1,0,z0],[x1,H,z0],[x1,H,z1]],
  [[1592,272],[1592,1112],[1852,1112],[1852,272]],
  [[1592,2212],[1592,1372],[1852,1372],[1852,2212]]);

/* размеры по ТЗ: фасадная пластина 110×129, корпус 110,2×129,2, глубина 52,3 */
const DW=110, DL=129, BW=110.2, BL=129.2, DH=52.3, PL=3;
const wx0=-DW/2+12.9, wx1=DW/2-12.9, wyT=DL/2-13, wyB=wyT-84.5, wcy=(wyT+wyB)/2;
const R=2.1, off=3.4+R, screws=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>[a*(DW/2-off),b*(DL/2-off)]);
const by=BL/2-48.4-5.2, bz=26.9+2.9, uy=-BL/2+48.9+4.65, uz=27.9+2.2;   // кнопка и USB-C, от тыла
const GROW=.5;                                                       // вырезы шире отверстий на 0,5 на сторону

const mDev=new THREE.MeshStandardMaterial({color:0xF6F6F3,roughness:.5});
const mWin=new THREE.MeshStandardMaterial({color:0x3a3a3c,roughness:.12,metalness:.1});
const mDark=new THREE.MeshStandardMaterial({color:0x2b2b2b,roughness:.5});
const mMetal=new THREE.MeshStandardMaterial({color:0xb9b9b9,roughness:.3,metalness:.85});
const mRing=new THREE.MeshStandardMaterial({color:0xFFD27A,emissive:0xFFB830,emissiveIntensity:.9,roughness:.4});
const mStk=new THREE.MeshStandardMaterial({color:0xFFDD2D,roughness:.42,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2});

const rect=(x0,y0,x1,y1,P=THREE.Shape)=>{const s=new P();s.moveTo(x0,y0);s.lineTo(x1,y0);s.lineTo(x1,y1);s.lineTo(x0,y1);s.closePath();return s};
const pill=(cx,cy,w,h,P=THREE.Path,rr)=>{const p=new P(),r=rr??Math.min(w,h)/2,a=w/2-r,b=h/2-r;
  p.moveTo(cx+a+r,cy-b);p.lineTo(cx+a+r,cy+b);p.absarc(cx+a,cy+b,r,0,Math.PI/2);p.lineTo(cx-a,cy+b+r);p.absarc(cx-a,cy+b,r,Math.PI/2,Math.PI);
  p.lineTo(cx-a-r,cy-b);p.absarc(cx-a,cy-b,r,Math.PI,Math.PI*1.5);p.lineTo(cx+a,cy-b-r);p.absarc(cx+a,cy-b,r,Math.PI*1.5,Math.PI*2);return p};
const revHole=p=>{const q=new THREE.Path(p.getPoints(24).reverse());return q};

/* наклейки — картинки из Фигмы (кадр 3381:63285, 4 px = 1 мм, с вылетами 3 мм): фасад 115×134, лента 484,3×57,3 */
const mFac=new THREE.MeshStandardMaterial({map:tex('tex/facade-color-2.webp?v=1'),roughness:.42,polygonOffset:true,polygonOffsetFactor:-2});
const mTape=new THREE.MeshStandardMaterial({map:tex('tex/tape-color.webp?v=1'),roughness:.42,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2});
// UV по координатам шейпа: f(x,y) → [s, d] — s вдоль ленты от старта, d от края фасада, мм
function setUV(geo,f,W,H,ox,oy){const p=geo.attributes.position,uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++){const [a,b]=f(p.getX(i),p.getY(i));uv.setXY(i,(a+ox)/W,1-(b+oy)/H)}uv.needsUpdate=true;return geo}
function device(v){
  const g=new THREE.Group();
  const add=(geo,mat,x,y,z,p=g)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m};
  add(new THREE.BoxGeometry(BW,BL,DH-PL),mDev,0,0,(DH-PL)/2);
  const s=rect(-DW/2,-DL/2,DW/2,DL/2);s.holes.push(rect(wx0,wyB,wx1,wyT,THREE.Path));
  for(const [x,y] of screws){const h=new THREE.Path();h.absarc(x,y,R,0,Math.PI*2,true);s.holes.push(h)}
  add(new THREE.ExtrudeGeometry(s,{depth:PL,bevelEnabled:false,curveSegments:24}),mDev,0,0,DH-PL);
  { const no=new THREE.MeshBasicMaterial({visible:false});   // тёмные стенки только внутри окна
    add(new THREE.BoxGeometry(wx1-wx0-.02,wyT-wyB-.02,PL),Array(4).fill(new THREE.MeshStandardMaterial({color:0x2b2b2b,roughness:.5,side:THREE.BackSide})).concat([no,no]),0,wcy,DH-PL/2); }
  add(new THREE.BoxGeometry(84.2,84.5,.6),mWin,0,wcy,DH-PL+.3);
  add(new THREE.TorusGeometry(26.5,1.1,12,64),mRing,0,wcy,DH-PL+.8);
  for(const [x,y] of screws){const c=add(new THREE.CylinderGeometry(R-.15,R-.15,.6,24),mMetal,x,y,DH-PL+.4);c.rotation.x=Math.PI/2}
  const side=(w,h,mat,y,z,d,rr)=>{const m=add(new THREE.ExtrudeGeometry(pill(0,0,w,h,THREE.Shape,rr),{depth:d,bevelEnabled:false,curveSegments:16}),mat,BW/2-.5,y,z);m.rotation.y=Math.PI/2};
  side(5.8,10.4,mDark,by,bz,.6);side(4.6,9.2,mDev,by,bz,1.1);side(4.4,9.3,mDark,uy,uz,.6,1.5);

  /* наклейки. ins — отступы края от рёбер: v=1 — фасад 0,5, лента без стыков на углах; v=2 — крест: фасад в край, стыки на углах */
  const E=.04, F=0, C=0, B=0;   // на модели наклейки в край, без белых полосок   // F — край фасада, C — вертикальные углы корпуса, B — тыл
  const face=(shape,rx,ry,pos,mat,uvf)=>{const geo=new THREE.ShapeGeometry(shape,32);
    if(uvf)setUV(geo,...uvf);
    const m=new THREE.Mesh(geo,mat);m.rotation.set(rx,ry,0);m.position.set(...pos);m.receiveShadow=true;g.add(m)};
  // фасад: картинка 115×134 — от края фасада −2,5 мм (рез на 0,5 внутри, вылет 3)
  { const s=rect(-DW/2+F,-DL/2+F,DW/2-F,DL/2-F);
    s.holes.push(rect(wx0,wyB,wx1,wyT,THREE.Path));                // окно — вырез точно в размер
    for(const [x,y] of screws){const h=new THREE.Path();h.absarc(x,y,R+.25,0,Math.PI*2,true);s.holes.push(h)}
    face(s,0,0,[0,0,DH+E],mFac,[(x,y)=>[x+DW/2,DL/2-y],115,134,2.5,2.5]); }
  // лента: правая (снизу вверх) → верх (справа налево) → левая (сверху вниз) → низ (слева направо); d — от фасада
  const TW=484.3,TH=57.3,uR=[(x,y)=>[y+BL/2,x+DH/2],TW,TH,3,2.5],uT=[(x,y)=>[BL+(BW/2-x),y+DH/2],TW,TH,3,2.5],
        uL=[(x,y)=>[BL+BW+(BL/2-y),DH/2-x],TW,TH,3,2.5],uB=[(x,y)=>[2*BL+BW+(x+BW/2),DH/2-y],TW,TH,3,2.5];
  const zF=DH+E;   // лента доходит до лица наклейки фасада — торец пластины не виден
  { const s=rect(-(zF-DH/2),-BL/2,-(B-DH/2),BL/2);
    s.holes.push(revHole(pill(-(bz-DH/2),by,5.8+2*GROW,10.4+2*GROW)));
    s.holes.push(revHole(pill(-(uz-DH/2),uy,4.4+2*GROW,9.3+2*GROW,THREE.Path,1.5+GROW)));
    face(s,0,Math.PI/2,[BW/2+E,0,DH/2],mTape,uR); }
  face(rect(B-DH/2,-BL/2,zF-DH/2,BL/2),0,-Math.PI/2,[-BW/2-E,0,DH/2],mTape,uL);
  face(rect(-BW/2,-(zF-DH/2),BW/2,-(B-DH/2)),-Math.PI/2,0,[0,BL/2+E,DH/2],mTape,uT);
  face(rect(-BW/2,B-DH/2,BW/2,zF-DH/2),Math.PI/2,0,[0,-BL/2-E,DH/2],mTape,uB);
  return g;
}

/* ЛОЖЕМЕНТ: чёрный вкладыш на всю внутреннюю площадь, слева 9 гнёзд под диски ⌀51 (3×3), справа гнездо под устройство */
const IN_H=38;                                   // высота вкладыша, мм
const ix0=x0+T, ix1=x1-T, iz0=z0+T, iz1=z1-T;    // внутренний периметр коробки
const PITCH=57, DR=26;                           // шаг сетки дисков и радиус гнезда (диск ⌀51 + зазор)
const DEVW=BW+1, DEVL=BL+1;                      // гнездо устройства с зазором 0,5 на сторону
const gap=((ix1-ix0)-(PITCH*2+2*DR)-DEVW)/3;
const discCX=ix0+gap+DR+PITCH, devCX=ix1-gap-DEVW/2;
const mFoam=new THREE.MeshStandardMaterial({color:0x161616,roughness:.92,metalness:0});
{
  const s=rect(ix0,-iz1,ix1,-iz0);               // шейп в (x, −z)
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const h=new THREE.Path();h.absarc(discCX+i*PITCH,-(j*PITCH),DR,0,Math.PI*2,true);s.holes.push(h)}
  s.holes.push(rect(devCX-DEVW/2,-DEVL/2,devCX+DEVW/2,DEVL/2,THREE.Path));
  const slab=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:IN_H,bevelEnabled:true,bevelThickness:.6,bevelSize:.6,bevelSegments:2,curveSegments:48}),mFoam);
  slab.rotation.x=-Math.PI/2;slab.position.y=T;slab.castShadow=slab.receiveShadow=true;box.add(slab);
  // дно гнёзд и диски
  const mDiscFace=new THREE.MeshStandardMaterial({color:0xF7F5F0,roughness:.35});
  const mDiscEdge=new THREE.MeshStandardMaterial({color:0xD9D6CF,roughness:.4});
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const x=discCX+i*PITCH, z=j*PITCH;
    const fl=new THREE.Mesh(new THREE.CylinderGeometry(DR+.2,DR+.2,IN_H-6,48),mFoam);fl.position.set(x,T+(IN_H-6)/2,z);fl.receiveShadow=true;box.add(fl);
    const d=new THREE.Mesh(new THREE.CylinderGeometry(25.5,25.5,3,64),[mDiscEdge,mDiscFace,mDiscEdge]);d.position.set(x,T+IN_H-6+1.5,z);d.castShadow=d.receiveShadow=true;box.add(d);
  }
  // устройство фасадом вверх, верх фасада — к петле крышки
  const dv=device(1);dv.rotation.x=-Math.PI/2;dv.position.set(devCX,T,0);box.add(dv);
}

/* ОТКРЫТКИ A6 105×148 на первом плане: слева лицо, справа сразу оборот; коробка с устройством — на фоне.
   Картинки из Фигмы по линии реза (без вылетов). Рисуются отдельной сценой поверх коробки. */
/* Варианты: по умолчанию прежние лица и обороты (set-fN / set-bN).
   «Светлый вариант» — лица и обороты в оттенках устройства (tex/card/dev-fN / dev-bN, секция «Новые варианты» в Фигме).
   «Коробка спереди» есть только в светлом, «Полный KV» и «Сокращённый KV» — только в тёмном. */
const CARDS=[['Коробка спереди','5','light'],['Полный KV','1','dark'],['Сокращённый KV','2','dark'],['3D-коробка ♫','3','both'],['3D-коробка ♪','4','both']];
const cardTex=new Map();
const CARD_REVS={"set-f1":"5a4cc99b23ed","set-b1":"079fe17731a8","set-f2":"46c4f3fe2dba","set-b2":"9a9b7746f71e","set-f3":"5a08744d958e","set-b3":"af1407d07287","set-f4":"23edeaca6e2c","set-b4":"632935c60550","dev-f3":"7637f97dbacb","dev-b3":"03f1b164efdc","dev-f4":"213233dd113f","dev-b4":"207e6c5b0c1c","dev-f5":"51e72759ebc3","dev-b5":"402d38a29bf9"};
let curCard=0;
const lightThemes={};
function loadCard(id,light,priority){
  const prefix=light?'dev-':'set-';
  const key=prefix+id;
  const cached=cardTex.get(key);
  if(cached){
    if(priority==='high')for(const img of cached.images)img.fetchPriority='high';
    return cached.ready;
  }
  const images=['f','b'].map(side=>{
    const file=prefix+side+id;
    const img=new Image();
    img.fetchPriority=priority;
    img.src=`tex/card/${file}.webp?v=${CARD_REVS[file]}`;
    return img;
  });
  const ready=Promise.all(images.map(img=>img.decode())).then(()=>images.map(img=>{
    const texture=new THREE.Texture(img);
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.anisotropy=8;
    texture.needsUpdate=true;
    return texture;
  }),()=>{
    cardTex.delete(key);
    return null;
  });
  cardTex.set(key,{images,ready});
  return ready;
}

async function prefetchCards(){
  if(navigator.connection?.saveData||navigator.connection?.effectiveType?.endsWith('2g'))return;
  for(const [,id,mode] of CARDS){
    if(mode!=='light')await loadCard(id,false,'low');
    if(mode!=='dark')await loadCard(id,true,'low');
  }
}

const ov=new THREE.Scene(), ovCam=new THREE.PerspectiveCamera(30,1,10,5000);
const mPaper=new THREE.MeshBasicMaterial({color:0xF4F2EC});
const mFront=new THREE.MeshBasicMaterial(), mBack=new THREE.MeshBasicMaterial();
/* мягкая тень под открыткой */
const shTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=340;const x=c.getContext('2d');
  x.filter='blur(22px)';x.fillStyle='rgba(60,30,0,.55)';x.fillRect(48,52,160,236);return new THREE.CanvasTexture(c)})();
function cardMesh(mFace){const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(105,148,.6),[mPaper,mPaper,mPaper,mPaper,mFace,mPaper]);g.add(m);
  const s=new THREE.Mesh(new THREE.PlaneGeometry(105*1.6,148*1.6),new THREE.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false}));
  s.position.set(6,-10,-3);g.add(s);ov.add(g);return g}
const cFront=cardMesh(mFront), cBack=cardMesh(mBack);
cFront.visible=cBack.visible=false;
const packedCard=new THREE.Mesh(new THREE.BoxGeometry(105,148,.6),[mPaper,mPaper,mPaper,mPaper,mFront,mBack]);
// A6 105×148 мм лежит на ложементе слева от корпуса устройства 110,2×129,2 мм.
packedCard.rotation.x=-Math.PI/2;packedCard.position.set(discCX,T+IN_H+1,0);
packedCard.castShadow=packedCard.receiveShadow=true;packedCard.visible=false;box.add(packedCard);
let cardsOn=true;
function layoutCards(){
  const D=900, a=innerWidth/innerHeight, vh=2*D*Math.tan(THREE.MathUtils.degToRad(ovCam.fov/2)), vw=vh*a;
  // Нижняя граница открыток всегда на 24 px выше панели, включая переносы кнопок.
  const panelTop=document.getElementById('cards').getBoundingClientRect().top;
  const bottom=(innerHeight-panelTop+24)/innerHeight*vh;
  const gap=.04;                                         // небольшой зазор между лицом и оборотом
  const s=Math.min(.94*vw/(105*(2+gap)), Math.max(0,panelTop-48)/innerHeight*vh/150);
  const cw=105*s;
  for(const [c,dir] of [[cFront,-1],[cBack,1]]){c.scale.setScalar(s);c.position.set(dir*cw*(.5+gap/2),-.5*vh+74*s+bottom,-D);c.rotation.set(-.04,-dir*.1,dir*.012)}
  layoutBox(panelTop-24);
  invalidate();
}
const ui=document.getElementById('cards');
const cardStatus=document.getElementById('cardStatus');
let cardRequest=0;
async function showCard(k,light=CARDS[k][2]==='light'||!!lightThemes[CARDS[k][1]]){
  const request=++cardRequest;
  cardStatus.textContent='Загружаю открытку…';
  const textures=await loadCard(CARDS[k][1],light,'high');
  if(request!==cardRequest)return;
  if(!textures){
    cardStatus.textContent='Не удалось загрузить открытку. Попробуйте ещё раз.';
    return;
  }

  if(!mFront.map)mFront.needsUpdate=mBack.needsUpdate=true;
  [mFront.map,mBack.map]=textures;
  cFront.visible=cBack.visible=true;
  packedCard.visible=!cardsOn;
  curCard=k;
  if(CARDS[k][2]==='both')lightThemes[CARDS[k][1]]=light;
  ui.querySelectorAll('[data-variant]').forEach((x,i)=>{x.className='variant-label'+(i===curCard?'':' g');x.setAttribute('aria-pressed',String(i===curCard))});
  ui.querySelectorAll('[data-theme-card]').forEach(x=>x.classList.toggle('is-active',Number(x.dataset.themeCard)===curCard));
  ui.querySelectorAll('[data-palette]').forEach(x=>x.setAttribute('aria-pressed',String(!!lightThemes[x.dataset.cardId]===(x.dataset.palette==='orange'))));
  cardStatus.textContent='Открытка · лицо и оборот';
  invalidate();
}
{
  CARDS.forEach(([n,id,mode],k)=>{
    const b=document.createElement('button');b.textContent=n;b.className='variant-label'+(k?' g':'');b.dataset.variant=k;b.setAttribute('aria-pressed',String(k===0));b.onclick=()=>showCard(k);
    let item=b;
    if(mode==='both'){
      const group=document.createElement('div');group.className='variant-control';group.dataset.themeCard=k;group.appendChild(b);
      const themes=document.createElement('div');themes.className='variant-themes';themes.setAttribute('role','group');themes.setAttribute('aria-label',n+' · цвет фона');
      for(const [palette,color,label] of [['pink','#FF8C9B','Розовый'],['orange','#FFB326','Оранжевый']]){
        const t=document.createElement('button');t.className='theme-choice';t.style.setProperty('--theme-color',color);t.dataset.palette=palette;t.dataset.cardId=id;
        t.title=label+' вариант';t.setAttribute('aria-label',n+' · '+label.toLowerCase()+' вариант');t.setAttribute('aria-pressed',String(palette==='pink'));
        t.onclick=()=>showCard(k,palette==='orange');themes.appendChild(t);
      }
      group.appendChild(themes);item=group;
    }
    ui.insertBefore(item,ui.querySelector('.placement'));
  });
}

/* крышка на петле у верхнего края задней стенки; клапан опускается поверх передней стенки */
const hinge=new THREE.Group();hinge.position.set(0,H+T,z0);box.add(hinge);
panel(hinge,[[x0,0,0],[x0,0,D+T],[x1,0,D+T],[x1,0,0]],
  [[272,1372],[272,2212],[1592,2212],[1592,1372]],
  [[272,1112],[272,272],[1592,272],[1592,1112]]);
panel(hinge,[[x0,0,D+2*T],[x0,-FLAP-T,D+2*T],[x1,-FLAP-T,D+2*T],[x1,0,D+2*T]],
  [[272,2212],[272,2472],[1592,2472],[1592,2212]],
  [[272,272],[272,12],[1592,12],[1592,272]]);

/* Коробка постоянно открыта, камера неподвижна. */
hinge.rotation.x=-THREE.MathUtils.degToRad(105);
const boxBounds=new THREE.Box3().setFromObject(box), boxCenter=boxBounds.getCenter(new THREE.Vector3());
/* Вращение: тянуть мышью — повернуть, колесо — приблизить, двойной щелчок — исходный вид. */
const view={yaw:0,pitch:0,zoom:1};let lastCardsTop=innerHeight;
{
  const el=renderer.domElement;el.style.touchAction='none';el.style.cursor='grab';
  let drag=null;
  el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId);el.style.cursor='grabbing'});
  el.addEventListener('pointermove',e=>{if(!drag)return;
    view.yaw-=(e.clientX-drag.x)*.008;view.pitch=THREE.MathUtils.clamp(view.pitch+(e.clientY-drag.y)*.006,-1.2,1);
    drag={x:e.clientX,y:e.clientY};layoutBox(lastCardsTop);invalidate()});
  const end=()=>{drag=null;el.style.cursor='grab'};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault();view.zoom=THREE.MathUtils.clamp(view.zoom*Math.exp(e.deltaY*.0012),.35,2.5);layoutBox(lastCardsTop);invalidate()},{passive:false});
  el.addEventListener('dblclick',()=>{view.yaw=view.pitch=0;view.zoom=1;layoutBox(lastCardsTop);invalidate()});
}
function layoutBox(cardsTop){
  // Открытая коробка остаётся фоном за крупными открытками, ракурс не вращается.
  const w=innerWidth,h=innerHeight,areaH=Math.max(60,cardsTop-12),pad=16;
  lastCardsTop=cardsTop;
  const direction=new THREE.Vector3(310,815,920).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),view.yaw);
  {const r=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),direction).normalize();
   const el=Math.asin(direction.y), target=THREE.MathUtils.clamp(el+view.pitch,THREE.MathUtils.degToRad(4),THREE.MathUtils.degToRad(88));
   direction.applyAxisAngle(r,el-target).normalize();}
  const right=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),direction).normalize();
  const up=new THREE.Vector3().crossVectors(direction,right);
  const tangent=Math.tan(THREE.MathUtils.degToRad(cam.fov/2));
  let distance=0;
  for(const x of [boxBounds.min.x,boxBounds.max.x])for(const y of [boxBounds.min.y,boxBounds.max.y])for(const z of [boxBounds.min.z,boxBounds.max.z]){
    const v=new THREE.Vector3(x,y,z).sub(boxCenter),depth=v.dot(direction);
    distance=Math.max(distance,depth+Math.abs(v.dot(right))/(tangent*Math.max(1,w-2*pad)/h),depth+Math.abs(v.dot(up))/(tangent*Math.max(1,areaH-2*pad)/h));
  }
  cam.position.copy(boxCenter).addScaledVector(direction,distance*view.zoom);
  cam.lookAt(boxCenter);cam.setViewOffset(w,h,0,(h-areaH)/2,w,h);
}

const bCards=document.getElementById('cardsBtn');
bCards.onclick=()=>{cardsOn=!cardsOn;packedCard.visible=!cardsOn&&!!mFront.map;
  bCards.textContent=cardsOn?'Положить в коробку':'Достать открытку';bCards.setAttribute('aria-pressed',String(!cardsOn));layoutCards()};

renderer.autoClear=false;
let renderQueued=false;
function invalidate(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(renderScene)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=ovCam.aspect=w/h;cam.updateProjectionMatrix();ovCam.updateProjectionMatrix();layoutCards()}
addEventListener('resize',resize);resize();
new ResizeObserver(layoutCards).observe(document.getElementById('cards'));
showCard(0);

function renderScene(){
  renderQueued=false;
  renderer.clear();renderer.render(scene,cam);
  if(cardsOn){renderer.clearDepth();renderer.render(ov,ovCam)}
}
</script>
</body>
